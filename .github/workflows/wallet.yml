name: wallet-pages
on:
  push:
    branches: [main]
    paths: ['wallet/**', '.github/workflows/wallet.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wallet/package-lock.json
      - name: Install
        working-directory: wallet
        run: npm ci
      - name: Crypto vector gate
        working-directory: wallet
        run: npm test -- --run
      - name: Build
        working-directory: wallet
        env:
          VITE_SEQUENCER_URL: https://soribium.fly.dev
          BASE_PATH: /soribium/
        run: |
          npm run build
          cp dist/index.html dist/404.html   # SPA deep-link fallback on Pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wallet/dist
      - id: deployment
        uses: actions/deploy-pages@v4
