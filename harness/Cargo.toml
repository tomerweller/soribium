[package]
name = "harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The harness computes every Poseidon2 hash through a Soroban Env so the
# off-chain tree can never diverge from the contract or (via the proven
# noir-lang/poseidon equivalence) the circuits.
soroban-sdk = { workspace = true, features = ["alloc", "testutils"] }
soroban-poseidon = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Grumpkin signing off-chain. Grumpkin's base field = BN254's scalar field
# (the circuit Field); Grumpkin's scalar field = BN254's base field.
ark-grumpkin = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
rand = "0.8"
stellar-strkey = "0.0.13"

[dev-dependencies]
# Property tests for build_batch (admission-rule space is combinatorial).
proptest = "1"
