server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers (issue #2 M5). CSP itself ships as a build-
    # injected <meta> tag (vite.config.ts) so the Pages deployment gets it
    # too; the header-only directives live here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # SPA fallback: unknown routes serve index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the sequencer — the wallet fetches '/api/...',
    # which removes CORS entirely for the compose deployment. SEQUENCER_URL
    # is substituted at container start (see the Dockerfile entrypoint).
    location /api/ {
        proxy_pass ${SEQUENCER_URL}/;
        proxy_set_header Host $host;
    }
}
